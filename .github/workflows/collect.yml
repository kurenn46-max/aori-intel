name: Collect Aori Intel
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect.js'
      - 'scripts/discover.js'
      - 'data/source-registry.json'
      - 'data/search-config.json'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: aori-intel-collector
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate collectors
        run: npm test
      - name: Collect fixed sources
        run: npm run collect
      - name: Search the open web
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: npm run discover
      - name: Commit changed intelligence
        run: |
          git config user.name "aori-intel-bot"
          git config user.email "aori-intel-bot@users.noreply.github.com"
          git add data/catches.json data/setnet.json data/source-status.json data/discovery.json data/discovery-status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update aori intelligence"
            git pull --rebase origin main
            git push
          fi
