name: Research public Kanpari endpoints
on:
  push:
    branches: ['research/kanpari-public-feeds-20261016']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/kanpari-public-endpoint-probe.js
