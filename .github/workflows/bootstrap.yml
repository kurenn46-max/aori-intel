name: Bootstrap AORI INTEL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild application package
        run: |
          cat bootstrap/package.*.b64 | base64 -d > /tmp/aori-intel.zip
          unzip -q /tmp/aori-intel.zip -d /tmp/aori-intel
          rsync -a --exclude='.github/workflows/' /tmp/aori-intel/aori-intel/ ./
          rm -rf bootstrap
      - name: Validate
        run: |
          npm test
          npm run validate
      - name: Commit application files
        run: |
          git config user.name "aori-intel-bot"
          git config user.email "aori-intel-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: release AORI INTEL v1"
          git push
