name: AORI INTEL quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/v2.1-data-quality-and-discovery', 'feature/v2.2-rotating-search-queries', 'feature/v2.3-aori-catch-focus', 'fix/v2.3.1-refresh-behavior', 'feature/v2.4-new-public-aori-sources']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run validate
      - name: Check extra aori source contribution
        run: |
          node - <<'JS'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('data/source-registry.json')); console.log('Secondary source registrations:',x.sources.filter(s=>s.adapter==='tsurirepo').map(s=>s.name));
          JS
      - name: Test real source ingestion (dry run)
        run: npm run collect
      - name: Show verified-vs-secondary Aori records in live dry run
        run: |
          node - <<'JS'
          const fs=require('fs'),c=JSON.parse(fs.readFileSync('data/catches.json'));
          const records=c.filter(x=>x.source?.includes('つりれぽ'));
          const counts=Object.fromEntries([...new Set(records.map(x=>x.source))].map(s=>[s,records.filter(x=>x.source===s).length]));
          console.log('EXTRA_SOURCE_REPORT',JSON.stringify({records:records.length,bySource:counts,dates:records.slice(0,8).map(x=>({date:x.date,region:x.region,source:x.source,catch_count:x.catch_count,count_basis:x.count_basis,verified:x.verified}))}));
          if(records.some(x=>x.mode!=='boat'||x.verified!==false))process.exit(1);
          JS
      - name: Test no-key regional discovery (dry run)
        env:
          BRAVE_SEARCH_API_KEY: ''
          DEBUG_DISCOVERY: '0'
        run: npm run discover
      - name: Verify discovery reported real attempts
        run: |
          node - <<'JS'
          const s=require('./data/discovery-status.json');
          if(s.queries_planned<8 || s.queries_ok<1) {
            console.error('RSS discovery was not functional',s);
            process.exit(1);
          }
          console.log({provider:s.provider,attempted:s.queries_planned,success:s.queries_ok,raw:s.raw_results,relevant:s.relevant_results,accepted:s.accepted});
          JS
